# Fork-only: build Cockpit.app (unsigned / ad-hoc) as a downloadable artifact.
# 本地无 Xcode 时的自用出包通道；不进上游 PR。无 Developer ID 签名与公证，
# 首次打开需右键 -> 打开（或 xattr -cr 移除 quarantine）。
name: cockpit-build-unsigned

on:
  workflow_dispatch:

jobs:
  macos:
    name: macOS app (unsigned)
    runs-on: macos-latest
    defaults: { run: { working-directory: cockpit } }
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # 与上游 cockpit-release.yml 一致的 beta 版本。
          flutter-version: 3.50.0-0.1.pre
          channel: beta
          cache: true

      # ghostty 需要固定版本的 Zig 编译（同上游 cockpit-release.yml）。
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Run Script phase 会以 universal 二进制构建 cockpit-cli。
      - name: Rust + targets macOS universal
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo --version

      # linux-x64 远程主机支持（上游只出 linux-arm64）。
      - name: Build linux-x64 cockpit-server bundle
        run: |
          rustup target add x86_64-unknown-linux-gnu
          chmod +x tool/build-linux-x64-server-bundle.sh
          tool/build-linux-x64-server-bundle.sh build/server-x64-bundle
        env:
          FLUTTER_ROOT: ${{ github.workspace }}/flutter

      - run: flutter pub get
      - run: flutter build macos --release

      # 把 linux-x64 bundle 塞进 app bundle，远程工作区即可连 x64 Linux 主机。
      - name: Embed linux-x64 bundle into app
        run: |
          APP="build/macos/Build/Products/Release/Cockpit.app"
          cp -R build/server-x64-bundle \
            "$APP/Contents/Resources/cockpit-server-bundle/targets/linux-x64"
          file "$APP/Contents/Resources/cockpit-server-bundle/targets/linux-x64/bin/cockpit-server"

      - name: Ad-hoc sign & zip
        run: |
          APP="build/macos/Build/Products/Release/Cockpit.app"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" Cockpit-zh.zip
          shasum -a 256 Cockpit-zh.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Cockpit-zh
          path: cockpit/Cockpit-zh.zip
